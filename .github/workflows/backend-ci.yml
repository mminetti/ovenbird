name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

env:
  AZURE_WEBAPP_NAME: ovenbird-api
  AZURE_WEBAPP_PACKAGE_PATH: './src/Web/publish'
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: 'Ovenbird.slnx'
  API_PROJECT_PATH: 'src/Web/Web.csproj'
  PUBLISH_DIR: './publish'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o ${{env.DOTNET_ROOT}}/webapi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: webapi
          path: ${{env.DOTNET_ROOT}}/webapi

  migrations:
    name: DbUp Migrations
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout (for DbUp scripts)
        uses: actions/checkout@v4

      - name: Setup .NET (for dbup-cli)
        uses: actions/setup-dotnet@v4
        with:
          # requires .net 9 https://github.com/drewburlingame/dbup-cli?tab=readme-ov-file#installation
          dotnet-version: "9.0.x"

      - name: Install DbUp CLI
        run: dotnet tool install --global dbup-cli-2
      - name: Run DbUp migrations from scripts folder
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          dbup upgrade ./scripts/dbup.yml --verbosity detail

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [migrations]
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: webapi

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_API_DEPLOY_TOKEN }}
          package: .